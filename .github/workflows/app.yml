# App image pipeline: test -> lint -> build -> scan -> push (main only).
#
# Pull requests run everything except the push, with no AWS credentials at all.
# On main, the exact image that passed the scan is pushed - it is never rebuilt,
# so what was scanned is byte-for-byte what gets deployed.
#
# Supply chain: run `pinact run -u` locally to pin every action to a commit SHA
# (tags can be moved - see the March 2026 trivy-action compromise).
name: app

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: sunshine-app
  TRIVY_VERSION: v0.69.3 # last release before the compromised v0.69.4

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: python -m pytest -q

  image:
    name: build / scan / push
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # only used on main, for the ECR push role
    steps:
      - uses: actions/checkout@v5

      - name: lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true # into the local Docker engine, so it can be scanned before any push
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true # only fail on findings a rebuild/upgrade can actually fix
          exit-code: "1"
          format: table

      - name: smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 --read-only --user 10001 \
            "${IMAGE}:${GITHUB_SHA}"
          for _ in $(seq 1 20); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS localhost:8080/ | tee /dev/stderr | grep -q "\"version\":\"${GITHUB_SHA}\""
          docker rm -f app

      # ---------- main only: publish ----------

      - name: AWS credentials (ECR push role)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: gha-ecr-push-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: ECR login
        if: github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # The repo is created by foundation-apply; on the very first merge both
          # workflows start together, so wait for it (max ~5 min).
          for _ in $(seq 1 30); do
            aws ecr describe-repositories --repository-names "$IMAGE" > /dev/null 2>&1 && break
            echo "waiting for ECR repository $IMAGE ..."; sleep 10
          done

          REMOTE="$REGISTRY/$IMAGE:$GITHUB_SHA"
          if aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            echo "$REMOTE already exists (tags are immutable) - skipping push"
          else
            docker tag "$IMAGE:$GITHUB_SHA" "$REMOTE"
            docker push "$REMOTE"
          fi

          DIGEST=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "### Image pushed"
            echo "- tag: \`$REMOTE\`"
            echo "- digest: \`$DIGEST\`"
            echo
            echo "Run **lab-up** to deploy it (the platform stack picks the newest image by digest)."
          } >> "$GITHUB_STEP_SUMMARY"
