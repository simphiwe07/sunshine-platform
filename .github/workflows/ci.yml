# Pull requests: format, lint, security scan, then plan every lab stack.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: fmt / tflint / checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.x"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: latest

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895 # v12
        with:
          directory: terraform
          framework: terraform
          config_file: .checkov.yaml

  plan:
    name: plan
    needs: static
    strategy:
      fail-fast: false
      matrix:
        stack:
          - terraform/envs/lab/foundation
          - terraform/envs/lab/platform
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_terraform.yml
    with:
      stack: ${{ matrix.stack }}
      command: plan
