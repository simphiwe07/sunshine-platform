# Everything environment-specific is passed in by Terraform (platform-k8s).

# Changes when any chart file changes, so a template-only edit still rolls out.
chartHash: ""

# Image by digest (repo@sha256:...) - exact scanned bytes, never a movable tag.
image: ""
region: eu-west-1
bucket: ""
# Subnets the load balancers live in - the only sources allowed to reach the
# app port (NetworkPolicy). Terraform passes the public subnet CIDRs.
loadBalancerCidrs: []
containerPort: 8080

serviceAccount:
  name: sunshine-app # Pod Identity association matches on this name

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi # no CPU limit: avoids throttling; requests drive scheduling/HPA

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

auth:
  # ALB authenticates every request against Cognito, except publicPaths.
  # Values come from the foundation stack's user pool (via platform-k8s).
  enabled: false
  userPoolArn: ""
  userPoolClientId: ""
  userPoolDomain: "" # prefix only, e.g. simptechit-lab
  issuer: ""         # https://cognito-idp.<region>.amazonaws.com/<pool id>
  signerPrefix: ""   # ARN prefix of the ALB allowed to sign x-amzn-oidc-data
  logoutUrl: ""
  scope: openid email
  sessionTimeoutSeconds: 28800 # 8h ALB session, then sign in again
  # Reachable without sign-in. Nothing that burns CPU or shows data: /burn is
  # an amplification endpoint and stays behind sign-in.
  publicPaths:
    - /healthz
    - /readyz

ingress:
  host: ""
  certificateArn: ""
  sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
  groupName: sunshine # several Ingresses can share one ALB

nlb:
  enabled: true
  host: ""
  certificateArn: ""

database:
  enabled: false
  host: ""
  name: app
  secretArn: ""
  refreshInterval: 1h # how often ESO re-reads Secrets Manager (picks up rotation)
