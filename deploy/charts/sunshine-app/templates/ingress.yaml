# AWS Load Balancer Controller turns these into ONE internet-facing ALB
# (IngressGroup): 80 -> 301 HTTPS, 443 with the wildcard cert, targets = pod IPs.
# ExternalDNS sees the host and creates the Route 53 alias record.
#
# Listener rules, in order (group.order, lowest first):
#   10  public:  health endpoints (smoke tests, uptime checks) - no sign-in
#               /metrics -> 404 at the ALB (Prometheus scrapes pods directly)
#   20  app:     everything else - Cognito sign-in first when auth is enabled
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunshine-app-public
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- include "app.albAnnotations" . | nindent 4 }}
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/actions.deny-metrics: >-
      {"type":"fixed-response","fixedResponseConfig":{"contentType":"text/plain","statusCode":"404","messageBody":"not found"}}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: deny-metrics
                port:
                  name: use-annotation
          {{- range .Values.auth.publicPaths }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: sunshine-app
                port:
                  name: http
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunshine-app
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    {{- include "app.albAnnotations" . | nindent 4 }}
    alb.ingress.kubernetes.io/group.order: "20"
    {{- if .Values.auth.enabled }}
    # Unauthenticated browser -> 302 to the Cognito hosted UI. The ALB keeps the
    # session in an encrypted cookie and adds x-amzn-oidc-* headers per request.
    alb.ingress.kubernetes.io/auth-type: cognito
    alb.ingress.kubernetes.io/auth-idp-cognito: {{ dict "userPoolARN" (required "auth.userPoolArn is required" .Values.auth.userPoolArn) "userPoolClientID" (required "auth.userPoolClientId is required" .Values.auth.userPoolClientId) "userPoolDomain" (required "auth.userPoolDomain is required" .Values.auth.userPoolDomain) | toJson | squote }}
    alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    alb.ingress.kubernetes.io/auth-scope: {{ .Values.auth.scope | quote }}
    alb.ingress.kubernetes.io/auth-session-cookie: AWSELBAuthSessionCookie
    alb.ingress.kubernetes.io/auth-session-timeout: {{ .Values.auth.sessionTimeoutSeconds | quote }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sunshine-app
                port:
                  name: http
