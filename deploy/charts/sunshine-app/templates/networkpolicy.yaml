# Enforced by the VPC CNI's network policy agent (enableNetworkPolicy).
# 1) deny all inbound traffic to every pod in this namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2) the app port only, only from inside the VPC: ALB/NLB nodes (pod-IP targets)
#    and kubelet health probes. Nothing else can connect to the app pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sunshine-app-from-vpc
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.vpcCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
