# Enforced by the VPC CNI's network policy agent (enableNetworkPolicy).
# 1) deny all inbound traffic to every pod in this namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# 2) the app port only, only from the load balancer subnets (public subnets,
#    where the ALB/NLB network interfaces live; targets are pod IPs).
#    NOT the whole VPC CIDR: pod IPs come from the VPC too, so that would let
#    any pod in any namespace in. Kubelet health probes are still allowed by
#    the VPC CNI policy agent (tested: pods stay Ready).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sunshine-app-from-load-balancers
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selector" . | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- /* an empty "from" would mean "allow everyone" - refuse to render that */}}
        {{- if not .Values.loadBalancerCidrs }}{{ fail "loadBalancerCidrs must list at least one CIDR" }}{{ end }}
        {{- range .Values.loadBalancerCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.containerPort }}
