# AWS access for the pods: EKS Pod Identity maps this service account to an IAM
# role (app bucket only). No annotations needed - unlike IRSA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
automountServiceAccountToken: false # the app never calls the Kubernetes API
