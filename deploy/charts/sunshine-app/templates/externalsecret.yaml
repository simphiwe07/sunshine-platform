{{- if .Values.database.enabled }}
# External Secrets Operator copies the RDS-managed secret from Secrets Manager
# into a Kubernetes Secret, and re-reads it every refreshInterval (rotation).
# No auth block: ESO uses its own Pod Identity role, which may read only this secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sunshine-db
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.database.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: sunshine-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "database.secretArn is required" .Values.database.secretArn }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.database.secretArn }}
        property: password
{{- end }}
